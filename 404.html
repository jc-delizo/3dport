<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/3dport/favicon.svg" />
    <title>404 — JC Delizo</title>
    <!-- Self-contained on purpose: no webfonts, no JS, no bundle — a lost
         visitor should not pay for anything but the way back. Palette is the
         Atrium theme's (see src/index.css). -->
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f4f6f8;
        color: #16202b;
        font: 16px/1.6 system-ui, -apple-system, 'Segoe UI', sans-serif;
        perspective: 1200px;
        padding: 24px;
      }
      .plane {
        max-width: 30rem;
        background: #fff;
        border: 1px solid #e3e8ed;
        border-radius: 1rem;
        padding: 2.5rem 2.75rem 2.75rem;
        box-shadow:
          0 1px 2px rgb(22 32 43 / 0.04),
          0 12px 28px -12px rgb(22 32 43 / 0.14),
          0 32px 64px -32px rgb(22 32 43 / 0.18);
        transform: translateY(8px) rotateX(4deg);
        transition: transform 600ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      .plane:hover { transform: none; }
      @media (prefers-reduced-motion: reduce) {
        .plane { transform: none; transition: none; }
      }
      .eyebrow {
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 10px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #1d4ed8;
        margin: 0;
      }
      h1 { font-size: 1.6rem; letter-spacing: -0.02em; margin: 0.75rem 0 0; }
      p { color: #5b6875; margin: 0.75rem 0 0; }
      a.back {
        display: inline-block;
        margin-top: 1.5rem;
        padding: 0.6rem 1.4rem;
        border-radius: 9999px;
        background: #1d4ed8;
        color: #fff;
        text-decoration: none;
        font-weight: 500;
      }
      a.back:focus-visible { outline: 2px solid #1d4ed8; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main class="plane">
      <p class="eyebrow">HTTP 404 · Not in scope</p>
      <h1>This page never shipped.</h1>
      <p>
        Either the link drifted, or this feature was cut in planning — it happens
        to the best of roadmaps. Everything that did ship is one click away.
      </p>
      <a class="back" href="/3dport/">Back to the portfolio</a>
    </main>
  </body>
</html>
